# LexArena config v1 (shape: docs/DATA_FORMATS.md §6). Every value here is read by code; none is defaulted in Python.
#
# Provenance tag on each value:
#   [SPEC xx]      stated in docs/SPEC.md section xx (still uncalibrated unless it says otherwise)
#   [D-0nn]        fixed by a logged decision in docs/DECISIONS.md
#   [MEASURED]     observed from the provider on 2026-10-06
#   [PLACEHOLDER]  chosen by Claude Code to make the system run; calibrate on the dev set in BUILD_PLAN Step 14
#
# Gemini free tier [MEASURED 2026-10-06]: 20 requests/day per model; gemini-3.8-flash returned 503 on most calls,
# then hit its quota, so roles use gemini-3.5-flash (clerk) and gemini-2.5-flash (judge, auditor, reflection),
# which answered 4/4 probes. Groq free tier [MEASURED]: 7,000 input tokens per request, 1,000 requests/day.
#
# Build-and-tune models only. Phase 2 will use paid DeepSeek and Qwen APIs; every calibrated value must be
# re-measured on those models before the freeze (see docs/OPEN_QUESTIONS.md R-014).

version: v1

providers:
  groq:
    kind: openai_compatible
    base_url: https://api.groq.com/openai/v1
    json_mode: json_schema               # [MEASURED] strict json_schema works on gpt-oss and qwen3.8
    max_tokens_param: max_completion_tokens
    timeout_s: 120                       # [PLACEHOLDER]
  gemini:
    kind: gemini
    base_url: https://generativelanguage.googleapis.com/v1beta
    json_mode: json_schema               # responseJsonSchema
    timeout_s: 300                       # [PLACEHOLDER] long judgments take ~30 s [MEASURED]

models:
  # Lawyers: one model for both sides (non-negotiable 3).
  lawyer:          {provider: groq,   family: gpt-oss, name: openai/gpt-oss-120b, temperature: 0.7, max_output_tokens: 2048, reasoning_effort: low, api_key_env: Groq_API1}   # temperature [PLACEHOLDER]  # reasoning_effort low [MEASURED 2026-10-09, D-081]: default reasoning filled the 2,048-token output cap
  # THEMIS-LOCAL layer 2 and entailment: different family from the lawyers [SPEC I3-7].
  verifier:        {provider: groq,   family: qwen,    name: qwen/qwen3.8-27b,    temperature: 0,   max_output_tokens: 2048, reasoning_effort: null, api_key_env: Groq_API3}
  judge:           {provider: gemini, family: gemini,  name: gemini-2.5-flash,    temperature: 0.3, max_output_tokens: 8192, reasoning_effort: null, api_key_env: gemini_api}  # temperature 0.3 [PLACEHOLDER, your request 2026-10-07 D-043]; Step 14 calibrates against the order-swap gap [SPEC E1]
  # THEMIS-GLOBAL: reads the whole transcript, so it needs long context.
  auditor:         {provider: gemini, family: gemini,  name: gemini-2.5-flash,    temperature: 0,   max_output_tokens: 8192, reasoning_effort: null, api_key_env: gemini_api}
  # Clerk two-model agreement: independent families (ARCHITECTURE §3).
  clerk_primary:   {provider: gemini, family: gemini,  name: gemini-3.5-flash,    temperature: 0,   max_output_tokens: 16384, reasoning_effort: null, api_key_env: gemini_api3}  # third key: the first two keys' daily quota went on Step 6 [D-060]
  clerk_secondary: {provider: groq,   family: gpt-oss, name: openai/gpt-oss-120b, temperature: 0,   max_output_tokens: 2048, reasoning_effort: null, api_key_env: Groq_API4}
  reflection:      {provider: gemini, family: gemini,  name: gemini-3.5-flash,    temperature: 0,   max_output_tokens: 8192, reasoning_effort: null, api_key_env: gemini_api2}  # second key; 2.5-flash is closed to new accounts [MEASURED 2026-10-07, D-044]
  # Step 3 drafting of overlay rows and predicates for your review: two independent families [D-041].
  drafter_primary:   {provider: gemini, family: gemini,  name: gemini-3.5-flash,    temperature: 0, max_output_tokens: 8192, reasoning_effort: null, api_key_env: gemini_api2}  # second key; 2.5-flash is closed to new accounts [MEASURED 2026-10-07, D-044]
  drafter_secondary: {provider: groq,   family: gpt-oss, name: openai/gpt-oss-120b, temperature: 0, max_output_tokens: 4096, reasoning_effort: null, api_key_env: Groq_API2}

prompts:
  schema_repair: {id: llm/schema_repair, version: 1}
  smoke: {id: smoke/dummy, version: 1}
  draft_overlay: {id: drafting/overlay, version: 4}     # v4 [D-043]: unique quotes, whole matching footnote, start date required
  draft_predicate: {id: drafting/predicate, version: 1}
  clerk_entities: {id: clerk/entities, version: 2}      # [D-056] v2: cause-title role [D-059]
  clerk_route: {id: clerk/route, version: 1}            # [D-056]
  clerk_record_facts: {id: clerk/record_facts, version: 1}   # [D-056 amendment, D-058]
  clerk_ground_truth: {id: clerk/ground_truth, version: 1}   # [D-056]
  clerk_entailment: {id: clerk/entailment, version: 2}  # [D-056] second family; v2 party roster [D-060]
  clerk_agent_view_repair: {id: clerk/agent_view_repair, version: 1}   # [D-060]
  clerk_probe: {id: clerk/probe, version: 1}            # [SPEC A4] asked of the lawyer model
  clerk_agent_view: {id: clerk/agent_view, version: 4}  # [D-056] v2 roster + sourced grounds, v3 pseudonym rule, v4 status list [D-059]
  themis_extract: {id: themis/extract_checklist, version: 2}   # [SPEC D1, D-062] verifier model, temperature 0; v2 quotes for numeric claims [D-066]
  themis_layer2: {id: themis/layer2_review, version: 1}   # [SPEC A2, D5, D-075] record fidelity + responsiveness, one call per draft
  themis_entailment: {id: themis/entailment, version: 1}   # [SPEC D4, D-075] one call per draft for all its precedent citations
  themis_global_audit: {id: themis_global/audit, version: 1}   # [SPEC E3, E5, D-076] auditor model, whole transcript, one call
  reflection_lessons: {id: reflection/lessons, version: 1}   # [SPEC F1-F7, D-077]
  reflection_compare: {id: reflection/compare, version: 1}   # [SPEC F3, D-077] same / opposite / different
  judge_decide: {id: judges/decide, version: 2}         # [D-071] one opinion per persona and order; v2 auditor's notes and bench memory [D-078]
  judge_revise: {id: judges/revise, version: 1}         # [D-071] the one revision (ARCHITECTURE §5)
  judge_personas:                                       # [SPEC E2] method, not outcome; approval in review/judge_personas [D-071]
    TEXTUALIST: {id: judges/persona_textualist, version: 1}
    PURPOSIVIST: {id: judges/persona_purposivist, version: 1}
    PROCEDURALIST: {id: judges/persona_proceduralist, version: 1}
  single_llm: {id: baselines/single_llm, version: 1}    # [D-072] the single-LLM baseline on the same case file
  agent_rules: {id: agents/rules, version: 1}           # [D-079] the same for both sides: knowledge-base and record rules
  agent_role: {id: agents/role, version: 1}             # [SPEC E6] the only template whose values differ by side
  agent_plan: {id: agents/plan, version: 1}             # [D-053] private strategy phase, research plan
  agent_notes: {id: agents/notes, version: 1}           # [D-053] private strategy phase, plan after research
  agent_turn: {id: agents/turn, version: 1}             # [D-079] one submission

llm:
  max_attempts: 4                        # [PLACEHOLDER] provider retries + schema repairs, per call
  backoff_initial_s: 2                   # [PLACEHOLDER]
  backoff_multiplier: 2                  # [PLACEHOLDER]
  backoff_max_s: 60                      # [PLACEHOLDER] Groq free tier refills tokens per minute [MEASURED]
  cache_enabled: true
  cache_path: .cache/llm_cache.sqlite
  log_path: .cache/logs/llm_calls.jsonl
  chars_per_token: 4                     # [PLACEHOLDER, D-077] estimate for prompt budgets where no tokenizer exists for the model

embedding:
  model: BAAI/bge-small-en-v1.5          # [SPEC B5]
  max_tokens: 512                        # model limit [SPEC B5]
  window_tokens: 480                     # [SPEC B5]
  batch_size: 32                         # [PLACEHOLDER] texts per embedding call (memory, not behaviour)
  cache_dir: .cache/models               # downloaded model files, git-ignored [D-047]
  query_instruction: "Represent this sentence for searching relevant passages: "   # [SPEC B5] bge-v1.5 retrieval prefix, ratio queries only

retrieval:
  facts_threshold: 0.75                  # [SPEC B6] uncalibrated
  ratio_threshold: 0.75                  # [PLACEHOLDER] SPEC B6 expects a separate value
  top_k: 5                               # [SPEC B7]
  candidate_pool: 30                     # [PLACEHOLDER] vector hits fetched before reranking to top_k [D-055]
  card_text_tokens: 80                   # [PLACEHOLDER] cap on each card's rule and matched passage [D-055]
  reranker:
    enabled: false                       # [D-055] measured worse and 9-11x slower; see reports/step5b_rerank.md
    model: Xenova/ms-marco-MiniLM-L-6-v2 # [D-055] chosen on speed and held-out quality, see reports/step5b_rerank.md

session:
  alternating_turns: 8                   # [D-011]
  parallel_closings: true                # [D-011]
  max_turn_tokens: 1200                  # [PLACEHOLDER] same cap for both sides [SPEC E1]
  lawyer_input_tokens: 6000              # [MEASURED R-011: Groq rejects >7,000 input tokens] budget per lawyer call; older turns condense first [D-055, D-079]
  research_queries: 3                    # [PLACEHOLDER, D-053] searches per side in the strategy phase, the same for both
  words_per_token: 0.75                  # [PLACEHOLDER] turns max_turn_tokens into the word guide shown to lawyers

themis_local:
  retry_cap: 3                           # [SPEC D8]
  extraction_min_confidence: 0.7         # [SPEC D1]
  repetition_hard_threshold: 0.95        # [SPEC D8]
  repetition_warn_threshold: 0.85        # [PLACEHOLDER, D-075] similarity to own earlier turn that warns (SPEC D8: below the hard threshold is a warning)
  score_weights: {rule: 0.5, llm: 0.5}   # [PLACEHOLDER]
  penalty_cap: 0.30                      # [SPEC D6]
  threshold_overlay_parameter: minimum_default_inr   # overlay parameter holding the dated minimum default [D-062]
  threshold_currency: INR                # amounts in the record are in this currency [D-062]
  threshold_date_readings:               # a dated threshold is checked only if it is the same under each reading [D-069]
    - {key: FILING, alternative: DEFAULT}
  amount_unit_words:                     # Indian numbering words, to read '1 crore' in a quote [D-066]
    - {word: crore, value: 10000000}
    - {word: lakh, value: 100000}
    - {word: lakhs, value: 100000}
    - {word: lac, value: 100000}
    - {word: lacs, value: 100000}
  limitation:                            # overlay parameter names and record labels for the date chain [D-063]
    period_parameter: limitation_period_years
    excluded_parameter: excluded_period            # SPEC C2 name
    minimum_balance_parameter: limitation_minimum_balance_days
    default_date_label: DEFAULT
    filing_date_label: FILING

judging:
  weights: {accuracy: 0.35, consistency: 0.25, rebuttal: 0.20, grounding: 0.20}   # [SPEC E1]
  order_swap_max_gap: 0.15               # [SPEC E1] fixed before measuring [D-024]
  tie_margin: 0.02                       # [SPEC E1] now applies to the secondary advocacy score [D-048]
  verdict_rule: BENCH_MAJORITY           # [D-048] supersedes SPEC E1 "higher aggregate wins"
  tie_break: ADVOCACY_SCORE              # [D-048] only when deciding judges split evenly
  abstain_on_order_swap_disagreement: true   # [D-051] Claude Code's proposal, open to change
  min_deciding_judges: 2                 # [D-051] [PLACEHOLDER] fewer -> UNSTABLE, reported apart
  check_reasons_with_layer1: true        # [ARCHITECTURE §5, D-071] THEMIS layer 1 on each opinion's stated law (one verifier call per opinion)
  show_audit_notes: true                 # [D-078] THEMIS-GLOBAL's point map and contradictions, never its scores; ablate on dev to check bias
  # Report limits, fixed before measuring [D-024]; Step 11 reports against them, nothing is re-run automatically [D-071].
  max_order_swap_disagreement_rate: 0.2  # [PLACEHOLDER] share of a persona's cases whose two orders disagree on the result
  persona_role_max_win_rate: 0.65        # [SPEC E1] a persona favouring one side above this ...
  persona_role_min_cases: 50             # [SPEC E1] ... over at least this many decided cases is flagged

memory:
  pinned_token_budget: 250               # [SPEC E6]
  pinned_k: 5                            # [PLACEHOLDER]
  decay_lambda: 0.98                     # [SPEC F4]
  retire_below_confidence: 0.2           # [SPEC F4]
  dedup_embedding_threshold: 0.90        # [PLACEHOLDER] SPEC F3 warns 0.90 can merge opposite lessons
  initial_confidence: 0.5                # [SPEC F4]
  confidence_step: 0.05                  # [PLACEHOLDER, D-077] rise or fall per use; an opposite newer lesson costs the older one this much
  max_lessons_per_case: 6                # [PLACEHOLDER, D-077] candidates kept per reflected session (after filters)
  # Base-rate phrasing (SPEC I3-5): a lesson containing any of these is rejected as a statistic, not a rule [D-077].
  base_rate_markers: ["usually win", "usually lose", "tend to win", "tend to lose", "more often than not", "most cases", "typically succeed", "typically fail", "are likely to win", "are likely to lose", "generally succeed", "generally fail", "base rate"]

evaluation:                              # [D-072] Step 12; the report reads these, nothing is tuned on them
  single_llm_role: judge                 # [D-072] same model as the bench, so the comparison isolates debate and verification
  bootstrap_resamples: 2000              # [PLACEHOLDER] resamples for percentile confidence intervals
  confidence_level: 0.95                 # [PLACEHOLDER]

runner:                                  # [D-073] Step 13
  runs_dir: runs                         # git-ignored; one folder per run (ledger, per-case outputs, report)
  allowed_splits: [DEV]                  # [D-073] the 500 are a red line until you start Phase 2 (CLAUDE.md §5.4)
  stage_timeout_s: 7200                  # [PLACEHOLDER] one stage subprocess
  quota_window_hours: 24                 # [D-073] trailing window; no provider reset hour needed
  ablations: [NO_THEMIS, NO_MEMORY, NO_EXHIBIT_CARDS]   # [SPEC G1] switches a run may name; the session stage reads them
  quotas:                                # [MEASURED 2026-10-06, R-011, R-012] free tiers, per (model, key variable)
    - {model: gemini-2.5-flash, api_key_env: gemini_api, requests_per_window: 20, tokens_per_window: null}
    - {model: gemini-3.5-flash, api_key_env: gemini_api2, requests_per_window: 20, tokens_per_window: null}
    - {model: gemini-3.5-flash, api_key_env: gemini_api3, requests_per_window: 20, tokens_per_window: null}
    - {model: openai/gpt-oss-120b, api_key_env: Groq_API1, requests_per_window: 1000, tokens_per_window: 200000}
    - {model: openai/gpt-oss-120b, api_key_env: Groq_API2, requests_per_window: 1000, tokens_per_window: 200000}
    - {model: qwen/qwen3.8-27b, api_key_env: Groq_API3, requests_per_window: 1000, tokens_per_window: 200000}
    - {model: openai/gpt-oss-120b, api_key_env: Groq_API4, requests_per_window: 1000, tokens_per_window: 200000}
  stage_requests:                        # [DERIVED, D-080] the most a stage can need, from the design; the G4 pilot measures the typical
    # SESSION: lawyer 2 strategy calls x 2 sides + 10 turns x (1 + retry_cap); verifier 3 calls per draft x 40 drafts + 6 judge
    # layer-1 checks x 2 (revision); judge 3 personas x 2 orders x 2 (one revision each); auditor 1 transcript audit.
    SESSION: [{role: lawyer, requests: 44}, {role: verifier, requests: 132}, {role: judge, requests: 12}, {role: auditor, requests: 1}]
    BASELINE: [{role: judge, requests: 1}]
    EVALUATE: []
    REFLECT: [{role: reflection, requests: 2}]

splits:
  test_count: 100                        # [INTENT]
  validation_count: 50                   # [SPEC G1] reporting only, no tuning [D-023]

vocabulary:
  # key_dates labels [SPEC H1 examples]; DECISION = simulation_date [D-039]. The clerk (Step 6) uses this list.
  case_date_labels: [DEFAULT, DEMAND_NOTICE, NOTICE_OF_DISPUTE, FILING, ADMISSION, CIRP_COMMENCEMENT, LIQUIDATION_ORDER, PLAN_SUBMISSION, PLAN_APPROVAL, DECISION]
  # temporal_overlay parameters [DATA_FORMATS §3 examples]; section_in_force drives get_statute [D-039].
  # Party statuses (SPEC H1 examples, extended): the legal position a party holds in the insolvency. Lawyer memory is keyed by it [D-013, D-059].
  party_statuses: [FINANCIAL_CREDITOR, OPERATIONAL_CREDITOR, CORPORATE_DEBTOR, SUSPENDED_DIRECTOR, PROMOTER, SHAREHOLDER, RESOLUTION_PROFESSIONAL, INTERIM_RESOLUTION_PROFESSIONAL, LIQUIDATOR, COMMITTEE_OF_CREDITORS, RESOLUTION_APPLICANT, SUCCESSFUL_RESOLUTION_APPLICANT, PERSONAL_GUARANTOR, CORPORATE_GUARANTOR, HOMEBUYER, ALLOTTEE, WORKMAN, EMPLOYEE, STATUTORY_AUTHORITY, TAX_AUTHORITY, REGULATOR, AUCTION_PURCHASER, MONITORING_AGENCY, INTERVENOR, BANK, OTHER]
  overlay_parameters: [section_in_force, minimum_default_inr, bar_window, excluded_period, precedent_overruled, limitation_period_years, limitation_minimum_balance_days]   # last two [D-067]

drafting:
  excerpt_chars: 2500                    # [PLACEHOLDER] characters around each search hit; Groq rejects >7k input tokens [MEASURED]
  max_excerpts: 3                        # [PLACEHOLDER]

clerk:
  version: clerk-v1                      # stamped into build.clerk_version [SPEC H1]
  furniture_min_page_share: 0.5          # [PLACEHOLDER] a line (digits ignored) on this share of pages is a running header/footer [SPEC H5-1, D-056]
  body_start_headings: [JUDGMENT, JUDGEMENT, ORDER, "ORAL JUDGMENT", "ORAL ORDER", "FINAL ORDER", "COMMON ORDER", "COMMON JUDGMENT"]   # upper case, any letter spacing; the header ends at the first [D-056]
  max_first_paragraph_number: 3          # [PLACEHOLDER] the court's numbering starts at or below this; a quoted '81.' cannot start it [D-061]
  min_paragraphs_per_page: 0.3           # [PLACEHOLDER] fewer paragraphs than this per page means the structure was not understood: the case is blocked [D-061]
  max_paragraph_number_jump: 2           # [PLACEHOLDER] a court number this far ahead still opens a paragraph (skips are flagged); bigger jumps are quotations
  # SPEC A1: the presumption is narrowed to exhibits; contested facts stay contested.
  presumptions: ["Exhibits are presumed genuine and duly executed; do not object that a document was not produced.", "Facts marked CONTESTED remain disputed.", "Nothing is known about an exhibit beyond its known_contents."]
  repair_rounds: 1                       # [PLACEHOLDER] extractor repair rounds after failed checks; problems left after them block the case [D-060]
  entailment_batch_chars: 12000         # [PLACEHOLDER] items + sources per entailment request; fits Groq's ~7k-token input limit [R-011, D-056]
  leakage_ngram: 12                      # [PLACEHOLDER] a run of this many words shared with the reasoning (and not with agent-visible text) is leakage; 8 flagged legal boilerplate on DEV_0002/0003 [D-060]
  grounds_max_ratio: 3.0                 # [PLACEHOLDER] flag when one side's opening grounds outnumber or outweigh the other's by more
  running_text_min_chars: 25             # [PLACEHOLDER] a header line this long recurring in the body is merged running text [D-056]
  # SPEC A3 evaluative words: a court-stated sentence with one is reasoning, never a record fact [D-056].
  evaluative_words: [erred, merely, satisfies, satisfied, failed, rightly, wrongly, correctly, incorrectly, hopelessly, clearly, admittedly, manifestly, untenable, unsustainable, misconceived, no merit, devoid of merit, cannot lie]
  route_chars_per_paragraph: 700        # [PLACEHOLDER] each paragraph's opening characters shown to the router (cost, not behaviour)
  # Words that are part of many names, so they never mark a leaked name on their own [D-056].
  generic_name_words: [ltd, limited, pvt, private, company, co, corporation, corp, india, indian, bank, of, the, and, for, services, financial, finance, industries, infrastructure, developers, projects, trading, investment, investments, enterprises, group, holdings, international, mr, ms, mrs, shri, smt, sri, dr, "m/s", messrs, union, state, national, authority, department, board, resolution, professional, liquidator, committee, creditors, organisation, organization, society, association, cooperative, "co-operative", fund, trust, through, its, director, directors, partner, proprietor]
  # The appellate court speaking in its own voice: never in the agent view [SPEC H5-12, D-056].
  court_voice_markers: ["this court has held", "this court is of the", "we are of the view", "we are of the considered view", "in our view", "in our opinion", "we hold that", "we find that", "we are satisfied", "we do not find", "we see no reason", "we are not inclined", "we are inclined", "this tribunal has already held", "this appellate tribunal has", "this tribunal is of the", "the appeal is dismissed", "the appeal is allowed", "the appeals are dismissed", "the appeals are allowed", "appeal stands dismissed", "appeal stands allowed", "in the result", "for the foregoing reasons", "as held below"]

seed: 7                                  # [PLACEHOLDER]
