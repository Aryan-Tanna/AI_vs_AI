# Local services for LexArena. Start with:
#   docker compose --env-file .env.docker up -d
# .env.docker is generated by scripts/make_env.py and read only by compose, never by Python.
# Ports bind to 127.0.0.1 only. Ground truth lives in its own database with its own user (non-negotiable 6).
# Qdrant has a write key and a read-only key; session processes get only the read-only one (D-034).
name: lexarena

services:
  mongo:
    image: mongo:8.0.32
    restart: unless-stopped
    ports: ["127.0.0.1:27017:27017"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${LEXARENA_MONGO_ROOT_USER:?set in .env.docker}
      MONGO_INITDB_ROOT_PASSWORD: ${LEXARENA_MONGO_ROOT_PASSWORD:?set in .env.docker}
      LEXARENA_MONGO_APP_DB: ${LEXARENA_MONGO_APP_DB:?set in .env.docker}
      LEXARENA_MONGO_APP_USER: ${LEXARENA_MONGO_APP_USER:?set in .env.docker}
      LEXARENA_MONGO_APP_PASSWORD: ${LEXARENA_MONGO_APP_PASSWORD:?set in .env.docker}
      LEXARENA_MONGO_SEALED_DB: ${LEXARENA_MONGO_SEALED_DB:?set in .env.docker}
      LEXARENA_MONGO_SEALED_USER: ${LEXARENA_MONGO_SEALED_USER:?set in .env.docker}
      LEXARENA_MONGO_SEALED_PASSWORD: ${LEXARENA_MONGO_SEALED_PASSWORD:?set in .env.docker}
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/10-lexarena-users.js:ro

  qdrant:
    image: qdrant/qdrant:v1.19.2
    restart: unless-stopped
    ports: ["127.0.0.1:6333:6333"]
    environment:
      QDRANT__SERVICE__API_KEY: ${LEXARENA_QDRANT_SERVER_API_KEY:?set in .env.docker}
      QDRANT__SERVICE__READ_ONLY_API_KEY: ${LEXARENA_QDRANT_SERVER_READ_ONLY_API_KEY:?set in .env.docker}
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:8.10.2-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:6379:6379"]
    command: ["redis-server", "--requirepass", "${LEXARENA_REDIS_PASSWORD:?set in .env.docker}"]

volumes:
  mongo_data:
  qdrant_data:
