[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lexarena"
version = "0.1.0"
description = "Multi-agent adversarial simulation of NCLAT insolvency appeals (research simulation, not legal advice)"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.163",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "pyyaml>=6",
    "numpy>=1.26",
    "rapidfuzz>=3",
    "z3-solver>=4.12",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pymongo>=4.10",
    "qdrant-client>=1.12",
    "redis>=5.0",
]

[project.optional-dependencies]
dense = ["sentence-transformers>=3"]          # bge-small-en-v1.5 dense retrieval
ui = ["streamlit>=1.37", "pandas>=2", "plotly>=5"]   # viewer
dev = ["pytest>=8", "ruff"]

[tool.setuptools.packages.find]
include = ["lexarena*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests that need docker compose services (mongo, qdrant, redis)",
    "live: tests that call real LLM APIs",
]

[tool.ruff]
line-length = 120
