[project]
name = "lexarena"
version = "0.1.0"
description = "Multi-agent adversarial simulation of NCLAT insolvency appeals (research simulation, not legal advice)"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.163",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
